name: Rust release

on:
  pull_request:
    paths: ['.github/workflows/rust-release.yml', 'scripts/package-rust-release.sh']
  push:
    tags: ['rust-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Match the tag to the package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml)
          test "$GITHUB_REF_NAME" = "rust-v$version"
      - run: cargo build -p mosh-rs --bins --release --locked --target "$RELEASE_TARGET"
      - name: Package and verify the extracted binaries
        shell: bash
        run: |
          archive=$(bash scripts/package-rust-release.sh "$RELEASE_TARGET")
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          package=${archive##*/}
          package=${package%.tar.gz}
          "$RUNNER_TEMP/$package/bin/mosh-rs" --version
          "$RUNNER_TEMP/$package/bin/mosh-rs-server" --version
          python3 scripts/verify-rust-cli.py --bin-dir "$RUNNER_TEMP/$package/bin" --network
      - uses: actions/upload-artifact@v4
        with:
          name: mosh-rs-${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mosh-rs-*
          merge-multiple: true
          path: target/dist
      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat target/dist/*.sha256 > target/dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "mosh-rs ${GITHUB_REF_NAME#rust-v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            target/dist/*.tar.gz target/dist/SHA256SUMS
