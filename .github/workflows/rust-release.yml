name: Rust release

on:
  pull_request:
    paths:
      - '.github/workflows/rust-release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust/**'
      - 'install.sh'
      - 'scripts/package-*-release.sh'
      - 'scripts/verify-linux-packages.sh'
      - 'scripts/verify-rust-cli.py'
      - 'scripts/update-homebrew-formula.py'
      - 'packaging/**'
      - 'Formula/**'
      - 'README*.md'
      - 'COPYING'
      - 'AUTHORS'
      - 'THANKS'
      - 'docs/rust-usage.md'
      - 'docs/rust-protocol.md'
      - 'docs/rust-macmini-verification.md'
      - 'docs/rust-release.md'
      - 'docs/releases/**'
  push:
    tags: ['rust-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            nfpm_arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            nfpm_arch: arm64
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Prepare the static musl toolchain
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools binutils
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          linker_var="CARGO_TARGET_$(echo "$RELEASE_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          echo "$linker_var=musl-gcc" >> "$GITHUB_ENV"
      - name: Match the tag to the package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml)
          test "$GITHUB_REF_NAME" = "rust-v$version"
      - run: cargo build -p mosh-rs --bins --examples --release --locked --target "$RELEASE_TARGET"
      - name: Verify static musl linking
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          for binary in mosh-rs mosh-rs-server; do
            readelf -l "target/$RELEASE_TARGET/release/$binary" > "$RUNNER_TEMP/$binary.program-headers"
            if grep -q INTERP "$RUNNER_TEMP/$binary.program-headers"; then
              echo "$binary unexpectedly requires a dynamic loader" >&2
              exit 1
            fi
          done
      - name: Package and verify the extracted binaries
        shell: bash
        run: |
          archive=$(bash scripts/package-rust-release.sh "$RELEASE_TARGET")
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          package=${archive##*/}
          package=${package%.tar.gz}
          "$RUNNER_TEMP/$package/bin/mosh-rs" --version
          "$RUNNER_TEMP/$package/bin/mosh-rs-server" --version
          python3 scripts/verify-rust-cli.py \
            --bin-dir "$RUNNER_TEMP/$package/bin" \
            --display-example "$PWD/target/$RELEASE_TARGET/release/examples/verify_display" \
            --network
      - name: Install nFPM
        if: endsWith(matrix.target, '-musl')
        shell: bash
        env:
          NFPM_VERSION: '2.48.0'
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/nfpm"
          cd "$RUNNER_TEMP/nfpm"
          archive="nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          release_url="https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION"
          curl -fsSL "$release_url/$archive" -o "$archive"
          curl -fsSL "$release_url/checksums.txt" -o checksums.txt
          sha256sum --ignore-missing --check checksums.txt
          tar -xzf "$archive" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: Package and install on Linux distributions
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          bash scripts/package-native-release.sh "$RELEASE_TARGET"
          bash scripts/verify-linux-packages.sh "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: mosh-rs-${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.deb
            target/dist/*.rpm
            target/dist/*.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mosh-rs-*
          merge-multiple: true
          path: target/dist
      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat target/dist/*.sha256 | sort -k 2 > target/dist/SHA256SUMS
          (
            cd target/dist
            sha256sum --strict --check SHA256SUMS
          )
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "mosh-rs ${GITHUB_REF_NAME#rust-v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            target/dist/*.tar.gz target/dist/*.deb target/dist/*.rpm target/dist/SHA256SUMS
