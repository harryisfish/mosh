name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p mosh-rs -- --check
      - run: cargo clippy -p mosh-rs --all-targets --locked -- -D warnings
      - run: cargo test -p mosh-rs --locked
      - run: cargo build -p mosh-rs --bins --examples --locked
      - run: target/debug/examples/verify_core
      - run: target/debug/examples/verify_transport
      - run: target/debug/examples/verify_display
      - run: target/debug/examples/verify_session
      - run: python3 scripts/verify-rust-cli.py --network
