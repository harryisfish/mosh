name: rust

on:
  push:
    paths: ['rust/**', 'Cargo.toml', 'Cargo.lock', 'scripts/verify-rust-cli.py', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'Cargo.toml', 'Cargo.lock', 'scripts/verify-rust-cli.py', '.github/workflows/rust.yml']

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p mosh-rs -- --check
      - run: cargo clippy -p mosh-rs --all-targets --locked -- -D warnings
      - run: cargo build -p mosh-rs --bins --examples --locked
      - run: target/debug/examples/verify_core
      - run: target/debug/examples/verify_transport
      - run: target/debug/examples/verify_display
      - run: target/debug/examples/verify_session
      - run: python3 scripts/verify-rust-cli.py --network
